<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#193d22">
<title>Change Password | AgriDoc Liberia</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 20px; background: #f7f6ef; color: #243128;
    font-family: "Segoe UI", Arial, sans-serif;
}
.card {
    width: 100%; max-width: 470px; padding: 38px;
    background: white; border: 1px solid #dfe6dc;
    border-top: 5px solid #c6a45a; border-radius: 10px;
    box-shadow: 0 16px 45px rgba(25,61,34,.10);
}
h1 { color: #193d22; font-size: 25px; margin: 0 0 10px; }
p { color: #68746b; line-height: 1.6; font-size: 14px; }
.notice {
    background: #f7f2e5; border-left: 3px solid #c6a45a;
    padding: 12px; margin: 20px 0; font-size: 13px;
}
label { display: block; margin: 17px 0 7px; font-size: 13px; font-weight: 650; }
input {
    width: 100%; padding: 13px; border: 1px solid #ccd6ca;
    border-radius: 6px; font-size: 15px;
}
button {
    width: 100%; margin-top: 24px; padding: 14px;
    border: 0; border-radius: 6px; background: #2d5a27;
    color: white; font-weight: 800; cursor: pointer;
}
.error { background: #fdecea; color: #a32620; padding: 12px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<section class="card">
    <h1>Secure Your Account</h1>
    <p>Your administrator issued a temporary password. You must create a new password before accessing AgriDoc Liberia.</p>
    <div class="notice">Use at least 12 characters. Do not reuse your temporary password.</div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label for="current_password">Current temporary password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
        <button type="submit">UPDATE PASSWORD</button>
    </form>
</section>
</body>
</html>
